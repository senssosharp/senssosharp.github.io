<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,6.2);

// lights for clean card shading
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(2,3,4); scene.add(key);
const rim = new THREE.DirectionalLight(0x8a9bff, 0.5); rim.position.set(-3,-1,2); scene.add(rim);

mouseLight.position.set(0,0,2.5); scene.add(mouseLight);

// --- card texture (procedural manga) ---
function makeCardTexture(){
  const W=512, H=760;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  // paper
  x.fillStyle='#ece7e0'; x.fillRect(0,0,W,H);
  // grain paper
  for(let i=0;i<3500;i++){ x.fillStyle=`rgba(0,0,0,${Math.random()*0.06})`; x.fillRect(Math.random()*W, Math.random()*H*0.7,1,1); }
  // art area
  x.save(); x.beginPath(); x.rect(0,0,W,H*0.70); x.clip();
  // bg wash
  const g=x.createLinearGradient(0,0,W,H*0.7); g.addColorStop(0,'#f5f1ea'); g.addColorStop(1,'#d8d2c8'); x.fillStyle=g; x.fillRect(0,0,W,H*0.7);
  // hair masses - bold ink strokes
  x.strokeStyle='#0a0a0a'; x.fillStyle='#0a0a0a'; x.lineCap='round';
  function strand(points,w){ x.lineWidth=w; x.beginPath(); x.moveTo(points[0][0],points[0][1]); for(let i=1;i<points.length;i++) x.quadraticCurveTo(points[i][0],points[i][1]-30,points[i][0],points[i][1]); x.stroke(); }
  // face base
  x.fillStyle='#f6f2eb';
  x.beginPath(); x.ellipse(W*0.52,H*0.36,78,95,0.15,0,Math.PI*2); x.fill();
  // shadow under chin / clothes
  x.fillStyle='#050505';
  x.beginPath(); x.moveTo(60,532); x.lineTo(W-40,532); x.lineTo(W-20,532); x.lineTo(W,380); x.lineTo(300,340); x.lineTo(180,400); x.lineTo(40,360); x.closePath(); x.fill();
  // hair long
  x.strokeStyle='#111'; 
  strand([[90,40],[70,200],[60,450]],22);
  strand([[150,30],[130,220],[110,480]],26);
  strand([[220,20],[210,200],[200,470]],30);
  strand([[320,25],[340,210],[360,470]],28);
  strand([[380,45],[400,220],[420,460]],20);
  // bangs
  x.fillStyle='#111';
  for(let i=0;i<9;i++){ const bx=140+i*28; x.beginPath(); x.moveTo(bx,80); x.quadraticCurveTo(bx+10,180,bx-8+i*3,230); x.quadraticCurveTo(bx+5,160,bx+22,90); x.fill(); }
  // headphones
  x.strokeStyle='#000'; x.lineWidth=14; x.beginPath(); x.arc(W*0.52,190,115,Math.PI*1.08,Math.PI*1.92); x.stroke();
  x.fillStyle='#0a0a0a'; x.fillRect(78,190,42,78); x.fillRect(W-120,190,42,78);
  x.fillStyle='#222'; x.fillRect(84,196,30,66); x.fillRect(W-114,196,30,66);
  // closed eyes (manga)
  x.strokeStyle='#000'; x.lineWidth=6;
  x.beginPath(); x.moveTo(190,270); x.quadraticCurveTo(215,278,240,270); x.stroke();
  x.beginPath(); x.moveTo(290,268); x.quadraticCurveTo(315,276,340,266); x.stroke();
  // lashes
  x.lineWidth=3;
  for(let i=0;i<3;i++){ x.beginPath(); x.moveTo(195+i*15,272); x.lineTo(190+i*15,285); x.stroke(); }
  // mouth small
  x.lineWidth=4; x.beginPath(); x.moveTo(248,330); x.quadraticCurveTo(262,335,276,330); x.stroke();
  // ink hatching
  x.strokeStyle='rgba(0,0,0,0.55)'; x.lineWidth=1.2;
  for(let i=0;i<40;i++){ const hx=60+Math.random()*400, hy=Math.random()*500; x.beginPath(); x.moveTo(hx,hy); x.lineTo(hx+18,hy+8); x.stroke(); }
  x.restore();
  // harsh contrast like screenshot photocopy + darken a lil
  x.fillStyle='rgba(0,0,0,0.22)'; x.fillRect(0,0,W,H*0.70);
  // bottom bar baked black so no white fringe under overlay
  x.fillStyle='#060607'; x.fillRect(0,H*0.70,W,H*0.30);
  x.fillStyle='#f2ede8'; x.font='italic 300 62px "Cormorant Garamond", Georgia, serif'; x.textAlign='center';
  x.save(); x.translate(W/2, H*0.70+ H*0.15); x.transform(1,0,-0.12,1,0,0);
  x.fillText('cc',0,14); x.restore();
  x.fillStyle='rgba(255,255,255,0.45)'; x.font='10px monospace'; x.fillText('001 — lie',W/2,H-18);

  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  return tex;
}
function makePhotoFront(img, name='cc'){
  const W=512, H=760;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#ece7e0'; x.fillRect(0,0,W,H);
  // cover-fit photo into top 70%
  const artH=H*0.70;
  x.save(); x.beginPath(); x.rect(0,0,W,artH); x.clip();
  try{ x.filter='contrast(1.12) brightness(0.82) saturate(0.85)'; }catch(e){}
  const iw=img.width||img.videoWidth||512, ih=img.height||img.videoHeight||512;
  const s=Math.max(W/iw, artH/ih);
  const dw=iw*s, dh=ih*s;
  x.drawImage(img,(W-dw)/2,(artH-dh)/2,dw,dh);
  try{ x.filter='none'; }catch(e){}
  // darken cleanly to sit in dark bg
  x.fillStyle='rgba(0,0,0,0.22)'; x.fillRect(0,0,W,artH);
  x.restore();
  // subtle grain to match dither vibe
  for(let i=0;i<1200;i++){ x.fillStyle=`rgba(0,0,0,${Math.random()*0.05})`; x.fillRect(Math.random()*W, Math.random()*artH,1,1); }
  x.fillStyle='#060607'; x.fillRect(0,artH,W,H-artH);
  x.fillStyle='#f2ede8'; x.font='italic 300 76px "Cormorant Garamond", Georgia, serif'; x.textAlign='center';
  x.save(); x.translate(W/2, artH+(H-artH)*0.52); x.transform(1,0,-0.12,1,0,0);
  x.fillText(name,0,16); x.restore();
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  return tex;
}
function makeBackTexture(name='cc', num='001'){
  const c=document.createElement('canvas'); c.width=512; c.height=760;
  const x=c.getContext('2d'); x.fillStyle='#0a0a0a'; x.fillRect(0,0,512,760);
  x.strokeStyle='#222'; x.strokeRect(20,20,472,720);
  x.fillStyle='#888'; x.font='italic 28px Georgia'; x.textAlign='center'; x.fillText('lie.',256,380);
  x.font='11px monospace'; x.fillText(`${name} — ${num}`,256,410);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const CW=0.88, CH=1.30, D=0.035;
const edgeMat=new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.5});
// photo is B&W idle, full color while touching (driven per-card by touch smoothing)
function addSatHook(mat, key){
  mat.userData.uSat={value:0};
  mat.customProgramCacheKey=()=>'cardsat_'+key;
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uSat=mat.userData.uSat;
    sh.fragmentShader=('uniform float uSat;\n'+sh.fragmentShader).replace(
      '#include <map_fragment>',
      `#include <map_fragment>
      float satLum=dot(diffuseColor.rgb, vec3(0.299,0.587,0.114));
      diffuseColor.rgb=mix(vec3(satLum), diffuseColor.rgb, uSat);`
    );
  };
}

const CARD_DEFS=[
  {id:'cc', name:'cc', title:'cc', sub:'Unwritten letters are hidden by demons.',
   links:[['telegram','https://t.me/extaseeeeee'],['soundcloud','https://soundcloud.com/kodexglobalcc']],
   files:['./card.jpg','./card.png','./card.jpeg','./card.webp'],
   track:['./music.mp3/i hate u so much.mp3','./music.mp3'],
   fallback:()=>makeCardTexture(), back:['cc','001'], edge:'#c9a86a'},
  {id:'unwritten', name:'unwritten', title:'unwritten', sub:'CC is like the last missing piece to the puzzle of my Thoughts.', edge:'#8a1010',
   links:[['telegram','https://t.me/mullvaddaemon'],['doxbin','https://doxbin.com/user/Unwrittenletters']],
   files:['./card2.jpg','./unwritten.jpg','./card2.png','./unwritten.png','./card2.jpeg','./unwritten.jpeg','./card2.webp','./unwritten.webp'],
   track:['./music.mp3/ailie - идеал.mp3','./music.mp3'],
   fallback:()=>makeDarkFallback(), back:['unwritten','002']},
];

const labelGeo=new THREE.PlaneGeometry(CW*0.998, CH*0.298);
const edgeGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(CW+0.0035, CH+0.0035, D+0.0035));
const boxGeo=new THREE.BoxGeometry(CW,CH,D);
const glowTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
 const g=x.createRadialGradient(128,128,10,128,128,128); g.addColorStop(0,'rgba(255,255,255,0.55)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,256,256);
 const t=new THREE.CanvasTexture(c); return t; })();

function createCard(def, idx){
  const frontMat=new THREE.MeshStandardMaterial({map:def.fallback(), roughness:0.55, metalness:0.05, color:0xffffff});
  addSatHook(frontMat, def.id);
  const backMat=new THREE.MeshStandardMaterial({map:makeBackTexture(def.back[0],def.back[1]), roughness:0.7});
  const box=new THREE.Mesh(boxGeo,[edgeMat,edgeMat,edgeMat,edgeMat,frontMat,backMat]);
  const group=new THREE.Group(); group.add(box);
  const labelBlackMat=new THREE.MeshStandardMaterial({map:makeLabelTex('#060607','#f2ede8',def.name), roughness:0.6});
  const labelWhiteMat=new THREE.MeshStandardMaterial({map:makeLabelTex('#d9e2e8','#0a0a0a',def.name), roughness:0.6, transparent:true, opacity:0});
  const labelBlackMesh=new THREE.Mesh(labelGeo,labelBlackMat);
  const labelWhiteMesh=new THREE.Mesh(labelGeo,labelWhiteMat);
  labelBlackMesh.position.set(0,-CH*0.351,D/2+0.002);
  labelWhiteMesh.position.set(0,-CH*0.351,D/2+0.0035);
  group.add(labelBlackMesh); group.add(labelWhiteMesh);
  const edgeWhite=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.12}));
  const edgeGold=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:def.edge||'#c9a86a',transparent:true,opacity:0.30}));
  const edgeBlack=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.55}));
  group.add(edgeWhite); group.add(edgeGold); group.add(edgeBlack);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,opacity:0.18,depthWrite:false}));
  glow.scale.set(2.25,2.25,1); glow.position.z=-0.3; group.add(glow);
  group.rotation.set(0.06,-0.14,0.02);
  group.scale.setScalar(0.94);
  scene.add(group);
  return {def, group, box, frontMat, labelBlackMat, labelWhiteMat, labelBlackMesh, labelWhiteMesh,
    edgeWhite, edgeGold, edgeBlack, glow, lean:0, labelOp:0, showAmt:1, swipe:0, lastPhoto:null,
    home:{x:0,y:-0.25}, phase:idx*2.1};
}
const cards=CARD_DEFS.map((d,i)=>createCard(d,i));
function layoutHomes(){
  const narrow=innerWidth<760;
  if(narrow){ cards[0].home={x:0,y:0.62}; cards[1].home={x:0,y:-0.78}; cards[0].anchor={x:-0.28}; cards[1].anchor={x:0.28}; }
  else { cards[0].home={x:-0.60,y:-0.25}; cards[1].home={x:0.60,y:-0.25}; cards[0].anchor={x:-0.60}; cards[1].anchor={x:0.60}; }
}
layoutHomes();

// ropes: twisted jute tubes pinned to the top of the screen
function makeRopeTexture(){
  const S=128, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d');
  x.fillStyle='#b28e4e'; x.fillRect(0,0,S,S);
  x.lineCap='round';
  for(let i=-S;i<S*2;i+=16){
    x.strokeStyle='rgba(90,64,28,0.85)'; x.lineWidth=7;
    x.beginPath(); x.moveTo(i,-4); x.lineTo(i+34,S+4); x.stroke();
    x.strokeStyle='rgba(226,196,130,0.9)'; x.lineWidth=2.5;
    x.beginPath(); x.moveTo(i+7,-4); x.lineTo(i+41,S+4); x.stroke();
  }
  for(let i=0;i<500;i++){ x.fillStyle=`rgba(60,40,15,${Math.random()*0.25})`; x.fillRect(Math.random()*S,Math.random()*S,1.5,1.5); }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(10,2);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
const ropeTex=makeRopeTexture();
function makeRope(){
  const mat=new THREE.MeshStandardMaterial({map:ropeTex, bumpMap:ropeTex, bumpScale:0.4, roughness:0.9, metalness:0, transparent:true, opacity:0});
  const mesh=new THREE.Mesh(new THREE.BufferGeometry(), mat);
  mesh.frustumCulled=false;
  scene.add(mesh);
  const knot=new THREE.Mesh(new THREE.TorusGeometry(0.022,0.009,8,20), new THREE.MeshStandardMaterial({color:0x8a6f3c, roughness:0.9}));
  scene.add(knot);
  return {mesh, knot};
}
const _anchor=new THREE.Vector3(), _up=new THREE.Vector3(), _top=new THREE.Vector3(), _mid=new THREE.Vector3();
const _poke=new THREE.Vector3(); const _planeZ0=new THREE.Plane(new THREE.Vector3(0,0,1),0);
cards.forEach(C=>{ C.rope=makeRope(); });

// save the unwritten picture as card2.jpg (or unwritten.jpg) next to index.html
function applyPhotoTo(card, img){
  try{
    card.lastPhoto=img;
    const tex=makePhotoFront(img, card.def.name);
    card.frontMat.map=tex; card.frontMat.needsUpdate=true;
  }catch(e){}
}
// redraw cards once webfont arrives so canvas uses thin italic like reference
if(document.fonts?.ready){
  document.fonts.load('italic 300 76px "Cormorant Garamond"').catch(()=>{});
  document.fonts.ready.then(()=>{
    try{
      cards.forEach(C=>{
        C.frontMat.map=C.lastPhoto?makePhotoFront(C.lastPhoto,C.def.name):C.def.fallback();
        C.frontMat.needsUpdate=true;
        const lb=makeLabelTex('#060607','#f2ede8',C.def.name); C.labelBlackMat.map=lb; C.labelBlackMat.needsUpdate=true;
        const lw=makeLabelTex('#d9e2e8','#0a0a0a',C.def.name); C.labelWhiteMat.map=lw; C.labelWhiteMat.needsUpdate=true;
      });
    }catch(e){}
  });
}
// bottom label box: black idle -> white on touch (overlays baked label)
function makeLabelTex(bg, fg, name){
  const W=512, H=228;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  x.fillStyle=fg; x.textAlign='center';
  x.font='italic 300 84px "Cormorant Garamond", Georgia, serif';
  x.save(); x.translate(W/2, H*0.58); x.transform(1,0,-0.12,1,0,0);
  x.fillText(name,0,0); x.restore();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
// dark fallback cover for cards without photo yet
function makeDarkFallback(){
  const W=512, H=760;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a1a1e'); g.addColorStop(1,'#08080a');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  for(let i=0;i<2500;i++){ x.fillStyle=`rgba(255,255,255,${Math.random()*0.04})`; x.fillRect(Math.random()*W, Math.random()*H*0.7,1,1); }
  x.fillStyle='#060607'; x.fillRect(0,H*0.70,W,H*0.30);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
// (card photo loading happens per-card below)
const texLoader=new THREE.TextureLoader(); texLoader.setCrossOrigin('anonymous');
cards.forEach(C=>{
  C.def.files.forEach(p=>{
    texLoader.load(p, t=>{ t.colorSpace=THREE.SRGBColorSpace; const im=t.image; if(im) applyPhotoTo(C,im); }, undefined, ()=>{});
  });
});
// also allow drop / paste of the image directly onto page
// landscape images -> background (like your wings art), portrait -> card
const bgimg=document.getElementById('bgimg');
function setBackground(img){
  try{
    const url = img.currentSrc || img.src;
    if(url) bgimg.src=url;
    else { const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0); bgimg.src=c.toDataURL(); }
  }catch(e){}
}
['./bg.jpg','./bg.png','./bg.webp','./background.jpg'].forEach(p=>{
  const im=new Image(); im.onload=()=>{ bgimg.src=p; }; im.src=p;
});
function loadFileAsPhoto(file){
  if(!file||!file.type.startsWith('image/')) return;
  const url=URL.createObjectURL(file);
  const im=new Image(); im.onload=()=>{
    const isBg = /bg|background|wings/i.test(file.name) || im.width > im.height*1.2;
    if(isBg) setBackground(im);
    else {
      const second = /unwritten|card2|card[_-]?2/i.test(file.name);
      applyPhotoTo(second?cards[1]:cards[0], im);
    }
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }; im.src=url;
}
addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer?.files?.[0]; if(f) loadFileAsPhoto(f); });
addEventListener('dragover', e=>e.preventDefault());
addEventListener('paste', e=>{ const f=[...(e.clipboardData?.files||[])][0]; if(f) loadFileAsPhoto(f); });

// (cards are created by the factory above; two cards: cc + unwritten)

// mouse — lean only while touching (press or hover on a card)
let mx=0,my=0,tx=0,ty=0,isDown=false,hasPointer=false;
let detailOpen=false, detailAmt=0, selectedId=null, downX=0, downY=0, dragMoved=false;
let hoverCard=null, dragCard=null;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const detailEl=document.getElementById('detail');
const audioctlEl=document.getElementById('audioctl');
const dTitle=document.getElementById('dtitle'), dSub=document.getElementById('dsub'), dLinks=document.getElementById('dlinks');
const exitBtn=document.getElementById('exit');
exitBtn.addEventListener('pointerdown',e=>e.stopPropagation());
exitBtn.addEventListener('click',e=>{ e.stopPropagation(); setDetail(null); });
const enterEl=document.getElementById('enter');
const enterTitle=enterEl?.querySelector('h1');
let entered=false, enterAmt=0;
let actx=null, gainNode=null, audioEl=null, muted=false, lastAT=0, volLevel=0.8;
const FADE=2.0;
function targetVol(){ return muted?0.0001:Math.max(0.0001,volLevel); }
function initAudio(files){
  try{
    if(actx){ actx.resume(); return; }
    actx=new (window.AudioContext||window.webkitAudioContext)();
    gainNode=actx.createGain(); gainNode.gain.value=0.0001; gainNode.connect(actx.destination);
    audioEl=new Audio(); audioEl.loop=true; audioEl.preload='auto';
    audioEl._files=(files&&files.length?files:['./music.mp3']).slice();
    audioEl._fi=0;
    if(!audioEl._fb){ audioEl._fb=true; audioEl.addEventListener('error',()=>{ audioEl._fi++; if(audioEl._fi<audioEl._files.length){ audioEl.src=encodeURI(audioEl._files[audioEl._fi]); audioEl.load(); } }); }
    audioEl.src=encodeURI(audioEl._files[0]);
    actx.createMediaElementSource(audioEl).connect(gainNode);
    audioEl.play().then(()=>{
      const t0=actx.currentTime;
      gainNode.gain.cancelScheduledValues(t0);
      gainNode.gain.setValueAtTime(0.0001,t0);
      gainNode.gain.exponentialRampToValueAtTime(targetVol(),t0+FADE+0.5);
    }).catch(()=>{});
    // little fade out into loop end + fade back in after wrap
    audioEl.addEventListener('timeupdate',()=>{
      if(!audioEl.duration||!actx) return;
      const ct=audioEl.currentTime, dur=audioEl.duration, t=actx.currentTime;
      if(ct>lastAT&&dur-ct<FADE){
        gainNode.gain.cancelScheduledValues(t);
        gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
        gainNode.gain.linearRampToValueAtTime(0.0001,t+(dur-ct));
      }
      if(ct<lastAT-0.5){
        gainNode.gain.cancelScheduledValues(t);
        gainNode.gain.setValueAtTime(0.0001,t);
        gainNode.gain.exponentialRampToValueAtTime(targetVol(),t+FADE);
      }
      lastAT=ct;
    });
  }catch(e){}
}
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('pointerdown',e=>e.stopPropagation());
const volEl=document.getElementById('vol');
volEl.addEventListener('pointerdown',e=>e.stopPropagation());
volEl.addEventListener('input',()=>{
  volLevel=Math.max(0.0001,volEl.value/100);
  if(volEl.value>0&&muted){ muted=false; muteBtn.textContent='sound on'; }
  if(actx&&gainNode&&!muted){
    const t=actx.currentTime;
    gainNode.gain.cancelScheduledValues(t);
    gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
    gainNode.gain.exponentialRampToValueAtTime(targetVol(),t+0.25);
  }
});
muteBtn.addEventListener('click',e=>{
  e.stopPropagation();
  muted=!muted;
  muteBtn.textContent=muted?'sound off':'sound on';
  if(actx&&gainNode){
    const t=actx.currentTime;
    gainNode.gain.cancelScheduledValues(t);
    gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
    if(muted) gainNode.gain.linearRampToValueAtTime(0.0001,t+0.4);
    else gainNode.gain.exponentialRampToValueAtTime(targetVol(),t+0.8);
  }
  if(audioEl&&audioEl.paused&&!muted) audioEl.play().catch(()=>{});
});
function dismissEnter(){
  if(!enterEl||enterEl.classList.contains('hidden')) return;
  entered=true;
  enterEl.classList.add('hidden');
  setTimeout(()=>enterEl.remove(),1000);
}
enterEl.addEventListener('click',dismissEnter);
addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ' ) dismissEnter(); });
// little 3d tilt on enter text
addEventListener('pointermove',e=>{
  if(!enterEl||enterEl.classList.contains('hidden')||!enterTitle) return;
  const nx=(e.clientX/innerWidth-0.5), ny=(e.clientY/innerHeight-0.5);
  enterTitle.style.transform=`rotateY(${(nx*10).toFixed(2)}deg) rotateX(${(-ny*10).toFixed(2)}deg) translateZ(12px)`;
});
function hitCardAll(cx,cy){
  ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  let best=null;
  cards.forEach(C=>{
    if(C.showAmt<0.3) return;
    const h=ray.intersectObject(C.box,false);
    if(h.length&&(!best||h[0].distance<best.d)) best={card:C,d:h[0].distance};
  });
  return best?best.card:null;
}
function updateHover(e){
  if(!entered){ hoverCard=null; return; }
  hoverCard=hitCardAll(e.clientX,e.clientY);
  canvas.style.cursor=hoverCard?'pointer':'default';
}
let currentTrack=null;
function startMusic(files,key){
  try{
    if(!actx){ currentTrack=key; initAudio(files); return; }
    actx.resume();
    if(currentTrack===key){
      if(audioEl&&audioEl.paused) audioEl.play().catch(()=>{});
      const t=actx.currentTime;
      gainNode.gain.cancelScheduledValues(t);
      gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
      gainNode.gain.exponentialRampToValueAtTime(targetVol(),t+FADE);
      return;
    }
    currentTrack=key;
    const t=actx.currentTime;
    gainNode.gain.cancelScheduledValues(t);
    gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
    gainNode.gain.linearRampToValueAtTime(0.0001,t+0.35);
    setTimeout(()=>{
      try{
        audioEl._files=(files&&files.length?files:['./music.mp3']).slice();
        audioEl._fi=0;
        audioEl.src=encodeURI(audioEl._files[0]);
        audioEl.load();
        audioEl.play().then(()=>{
          const t2=actx.currentTime;
          gainNode.gain.cancelScheduledValues(t2);
          gainNode.gain.setValueAtTime(0.0001,t2);
          gainNode.gain.exponentialRampToValueAtTime(targetVol(),t2+FADE);
        }).catch(()=>{});
      }catch(e){}
    },380);
  }catch(e){}
}
function stopMusic(){
  try{
    if(!actx||!gainNode||!audioEl) return;
    const t=actx.currentTime;
    gainNode.gain.cancelScheduledValues(t);
    gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
    gainNode.gain.linearRampToValueAtTime(0.0001,t+0.6);
    const el=audioEl;
    setTimeout(()=>{ if(!detailOpen&&el&&!el.paused) el.pause(); },750);
  }catch(e){}
}
function setDetail(id){
  selectedId=id;
  detailOpen=!!id;
  detailEl.classList.toggle('open',detailOpen);
  audioctlEl.classList.toggle('show',detailOpen);
  exitBtn.classList.toggle('show',detailOpen);
  if(detailOpen){
    const cfg=cards.find(C=>C.def.id===id).def;
    dTitle.textContent=cfg.title;
    dSub.textContent=cfg.sub||'';
    dSub.style.display=cfg.sub?'':'none';
    dLinks.innerHTML='';
    cfg.links.forEach(([label,href])=>{
      const a=document.createElement('a');
      a.href=href; a.target='_blank'; a.rel='noopener'; a.textContent=label;
      dLinks.appendChild(a);
    });
    startMusic(cfg.track,cfg.id);
  } else {
    stopMusic();
  }
}
addEventListener('pointermove',e=>{
  hasPointer=true;
  if(isDown&&!dragMoved&&Math.hypot(e.clientX-downX,e.clientY-downY)>7) dragMoved=true;
  tx=(e.clientX/innerWidth-0.5)*2;
  ty=(e.clientY/innerHeight-0.5)*2;
  updateHover(e);
});
addEventListener('pointerdown',e=>{ isDown=true; hasPointer=true; downX=e.clientX; downY=e.clientY; dragMoved=false; dragCard=entered?hitCardAll(e.clientX,e.clientY):null; if(dragCard){ ndc.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera); if(ray.ray.intersectPlane(_planeZ0,_poke)){ dragCard.grabOX=_poke.x-dragCard.group.position.x; dragCard.grabOY=_poke.y-dragCard.group.position.y; } } updateHover(e); });
addEventListener('pointerup',e=>{
  const moved=Math.hypot(e.clientX-downX, e.clientY-downY);
  isDown=false; dragCard=null; dragMoved=false;
  if(!entered) return;
  const hit=hitCardAll(e.clientX,e.clientY);
  if(moved<7){
    if(hit&&selectedId!==hit.def.id) setDetail(hit.def.id);
  }
});
// (leaving works only via the exit button top-left)
addEventListener('pointerleave',()=>{ isDown=false; hoverCard=null; dragCard=null; hasPointer=false; });
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  layoutHomes();
});

const clock=new THREE.Clock();
let prevT=0;
function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  const dt=Math.min(0.05, Math.max(0.001, t-prevT||0.016)); prevT=t;
  // soft follow — no snap
  mx+=(tx-mx)*0.035; my+=(ty-my)*0.035;
  if(!hasPointer){ hoverCard=null; dragCard=null; }
  // card shows normally after entering: ease scale/position in
  enterAmt+=((entered?1:0)-enterAmt)*0.045;
  const enterEase=enterAmt*enterAmt*(3-2*enterAmt);
  // idle float always; lean offsets only apply with lean factor
  const narrow=innerWidth<760;
  const detailTX=narrow?0:-0.55, detailTY=narrow?0.55:-0.05;
  detailAmt+=((detailOpen?1:0)-detailAmt)*(detailOpen?0.035:0.022);
  ray.setFromCamera(ndc.set(tx,-ty),camera);
  ray.ray.intersectPlane(_planeZ0,_poke);
  const MENU_S=0.62;
  let maxLean=0;
  cards.forEach((C,idx)=>{
    const isSel=selectedId===C.def.id;
    C.selW=(C.selW||0); C.bgW=(C.bgW||0);
    const wantSel=isSel?1:0, wantBg=(selectedId&&!isSel)?1:0;
    C.selW+=(wantSel-C.selW)*(wantSel>C.selW?0.035:0.022);
    C.bgW+=(wantBg-C.bgW)*(wantBg>C.bgW?0.035:0.022);
    const sW=C.selW*C.selW*(3-2*C.selW), bgE=C.bgW*C.bgW*(3-2*C.bgW);
    const wantLean=(!entered||(selectedId&&!isSel))?0:((hoverCard===C||dragCard===C)?1:0);
    C.lean+=(wantLean-C.lean)*(wantLean>C.lean?0.06:0.018);
    if(C.lean>maxLean) maxLean=C.lean;
    C.spin=(C.spin||0);
    const wantSpin=(entered&&isDown&&dragMoved&&dragCard===C)?1:0;
    C.spin+=(wantSpin-C.spin)*(wantSpin>C.spin?0.06:0.018);
    C.grab=(C.grab||0);
    const wantGrab=(entered&&isDown&&dragMoved&&dragCard===C&&!selectedId)?1:0;
    C.grab+=(wantGrab-C.grab)*(wantGrab>C.grab?0.12:0.05);
    const ge=C.grab*C.grab*(3-2*C.grab);
    // dragged card swipes the other one into the background
    const peer=(isDown&&dragMoved)?dragCard:null;
    const wantSwipe=(!entered||selectedId||!peer||peer===C)?0:1;
    C.swipe+=(wantSwipe-C.swipe)*(wantSwipe>C.swipe?0.035:0.02);
    // (no hover motion: cards only move while holding LMB)
    // bottom box: black idle -> white on touch (smoothed)
    const eased=C.lean*C.lean*(3-2*C.lean);
    C.labelOp+=(eased-C.labelOp)*0.06;
    C.labelWhiteMat.opacity=Math.max(C.labelOp,sW)*(1-C.swipe);
    if(C.frontMat.userData.uSat) C.frontMat.userData.uSat.value=Math.max(C.labelOp,sW)*(1-C.swipe);
    const wantShow=1; // other card stays visible in the background, never shrinks away
    C.showAmt+=(wantShow-C.showAmt)*0.07;
    const showEase=C.showAmt*C.showAmt*(3-2*C.showAmt);
    C.group.scale.setScalar(Math.max(0.0001,(0.94+0.06*enterEase)*MENU_S*(1+sW*0.62)*showEase*(1+0.10*ge)*(1-0.18*C.swipe)*(1-0.20*bgE)));
    const px=C.home.x+Math.sin(t*0.6+C.phase)*0.04+(mx*0.5)*ge;
    const py=C.home.y+Math.sin(t*1.1+C.phase)*0.08+(-my*0.3)*ge-(1-enterEase)*0.25;
    const gx=THREE.MathUtils.clamp(_poke.x-(C.grabOX||0),C.home.x-1.3,C.home.x+1.3);
    const gy=THREE.MathUtils.clamp(_poke.y-(C.grabOY||0),-1.2,1.0);
    let fx=px*(1-ge)+gx*ge, fy=py*(1-ge)+gy*ge;
    if(sW>0.0005){ fx=px*(1-sW)+detailTX*sW; fy=py*(1-sW)+detailTY*sW+Math.sin(t*1.1)*0.03*sW; }
    else if(bgE>0.0005){ fx=px*(1-bgE)+C.home.x*1.35*bgE; fy=py*(1-bgE)+(C.home.y+0.12)*bgE; }
    else if(peer&&peer!==C){ const _s=C.swipe; fx=fx*(1-_s)+(peer.home.x+(idx===0?-0.24:0.24))*_s; fy=fy*(1-_s)+(peer.home.y+0.02)*_s; }
    C.group.position.set(fx,fy,0.30*ge-0.8*C.swipe+0.25*sW-1.3*bgE);
    const vxx=THREE.MathUtils.clamp((fx-(C.ppx??fx))/Math.max(dt,0.001),-2,2);
    const vyy=THREE.MathUtils.clamp((fy-(C.ppy??fy))/Math.max(dt,0.001),-2,2);
    C.ppx=fx; C.ppy=fy;
    C.svx=(C.svx||0)+(vxx-(C.svx||0))*0.12;
    C.svy=(C.svy||0)+(vyy-(C.svy||0))*0.12;
    const faceFront=sW*0.7;
    C.group.rotation.y=(-0.10)*(1-faceFront)+Math.sin(t*0.7+C.phase)*0.03-0.35*C.swipe;
    C.group.rotation.x=(0.04)*(1-faceFront)+Math.cos(t*0.9+C.phase)*0.025;
    C.group.rotation.z=0.015+Math.sin(t*0.5+C.phase)*0.015;
    C.frontMat.color.setScalar((1-0.45*C.swipe)*(1-0.40*bgE));
    // slow permanent drift around card — horizontal + vertical, gold / black / white
    const driftX=Math.sin(t*0.45+C.phase)*0.007+Math.sin(t*0.23+1.7+C.phase)*0.004;
    const driftY=Math.sin(t*0.38+0.6+C.phase)*0.006+Math.sin(t*0.19+2.1+C.phase)*0.0035;
    C.edgeWhite.material.opacity=0.10+C.labelOp*0.20;
    C.edgeGold.material.opacity=0.28+C.labelOp*0.14;
    C.edgeBlack.material.opacity=0.50;
    C.edgeGold.position.set(driftX+0.005, driftY+0.004, 0);
    C.edgeBlack.position.set(driftX-0.005, driftY-0.004, 0);
    C.edgeWhite.position.set(driftX*0.4, driftY*0.4, 0);
    C.labelWhiteMesh.position.x=driftX*0.6; C.labelWhiteMesh.position.y=-CH*0.351+driftY*0.6;
    C.labelBlackMesh.position.x=driftX*0.4; C.labelBlackMesh.position.y=-CH*0.351+driftY*0.4;
    // rope follows the card top, pinned to the top of the screen (lags behind motion like a real rope)
    _anchor.set(C.anchor.x,3.1,-0.4);
    _up.set(0,1,0).applyQuaternion(C.group.quaternion);
    _top.copy(C.group.position).addScaledVector(_up,(CH/2)*C.group.scale.x);
    _mid.copy(_anchor).lerp(_top,0.5);
    _mid.x+=Math.sin(t*0.7+C.phase)*0.04-C.svx*0.12;
    _mid.y-=0.05+C.svy*0.09;
    const ropeCurve=new THREE.QuadraticBezierCurve3(_anchor.clone(),_mid.clone(),_top.clone());
    C.rope.mesh.geometry.dispose();
    C.rope.mesh.geometry=new THREE.TubeGeometry(ropeCurve,18,0.016,6,false);
    C.rope.mesh.material.opacity=Math.min(1,(0.9*showEase+0.1*C.lean)*enterEase);
    C.rope.knot.position.copy(_top);
    C.rope.knot.visible=showEase>0.05;
    C.rope.knot.rotation.z=Math.sin(t*0.9+C.phase)*0.2;
  });
  // mouse light follows cursor in world, small radius pop when touching
  const lx=mx*2.6, ly=-my*1.8;
  mouseLight.position.x+=(lx-mouseLight.position.x)*0.07;
  mouseLight.position.y+=(ly-mouseLight.position.y)*0.07;
  mouseLight.position.z=1.8;
  const wantI = !hasPointer ? 0.7 : ((isDown||hoverCard) ? 9.0 : 2.2);
  mouseLight.intensity += (wantI - mouseLight.intensity)*0.05;
  // slight camera drift for parallax vs bg
  camera.position.x=mx*0.15*maxLean; camera.position.y=-my*0.1*maxLean; camera.lookAt(0,-0.2,0);
  if(bgimg) bgimg.style.translate=`${(-mx*14).toFixed(1)}px ${(-my*10).toFixed(1)}px`;
  renderer.render(scene,camera);
}
tick();
</script>
