  @keyframes ditherBlink{0%,100%{opacity:0.50}50%{opacity:0.62}}

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,6.2);

// lights for clean card shading
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(2,3,4); scene.add(key);
const rim = new THREE.DirectionalLight(0x8a9bff, 0.5); rim.position.set(-3,-1,2); scene.add(rim);
// little radius highlight that follows the mouse
const mouseLight = new THREE.PointLight(0xfff1dd, 2.2, 4.5, 2.0);
mouseLight.position.set(0,0,2.5); scene.add(mouseLight);

// --- card texture (procedural manga) ---
function makeCardTexture(){
  const W=512, H=760;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  // paper
  x.fillStyle='#ece7e0'; x.fillRect(0,0,W,H);
  // grain paper
  for(let i=0;i<3500;i++){ x.fillStyle=`rgba(0,0,0,${Math.random()*0.06})`; x.fillRect(Math.random()*W, Math.random()*H*0.7,1,1); }
  // art area
  x.save(); x.beginPath(); x.rect(0,0,W,H*0.70); x.clip();
  // bg wash
  const g=x.createLinearGradient(0,0,W,H*0.7); g.addColorStop(0,'#f5f1ea'); g.addColorStop(1,'#d8d2c8'); x.fillStyle=g; x.fillRect(0,0,W,H*0.7);
  // hair masses - bold ink strokes
  x.strokeStyle='#0a0a0a'; x.fillStyle='#0a0a0a'; x.lineCap='round';
  function strand(points,w){ x.lineWidth=w; x.beginPath(); x.moveTo(points[0][0],points[0][1]); for(let i=1;i<points.length;i++) x.quadraticCurveTo(points[i][0],points[i][1]-30,points[i][0],points[i][1]); x.stroke(); }
  // face base
  x.fillStyle='#f6f2eb';
  x.beginPath(); x.ellipse(W*0.52,H*0.36,78,95,0.15,0,Math.PI*2); x.fill();
  // shadow under chin / clothes
  x.fillStyle='#050505';
  x.beginPath(); x.moveTo(60,532); x.lineTo(W-40,532); x.lineTo(W-20,532); x.lineTo(W,380); x.lineTo(300,340); x.lineTo(180,400); x.lineTo(40,360); x.closePath(); x.fill();
  // hair long
  x.strokeStyle='#111'; 
  strand([[90,40],[70,200],[60,450]],22);
  strand([[150,30],[130,220],[110,480]],26);
  strand([[220,20],[210,200],[200,470]],30);
  strand([[320,25],[340,210],[360,470]],28);
  strand([[380,45],[400,220],[420,460]],20);
  // bangs
  x.fillStyle='#111';
  for(let i=0;i<9;i++){ const bx=140+i*28; x.beginPath(); x.moveTo(bx,80); x.quadraticCurveTo(bx+10,180,bx-8+i*3,230); x.quadraticCurveTo(bx+5,160,bx+22,90); x.fill(); }
  // headphones
  x.strokeStyle='#000'; x.lineWidth=14; x.beginPath(); x.arc(W*0.52,190,115,Math.PI*1.08,Math.PI*1.92); x.stroke();
  x.fillStyle='#0a0a0a'; x.fillRect(78,190,42,78); x.fillRect(W-120,190,42,78);
  x.fillStyle='#222'; x.fillRect(84,196,30,66); x.fillRect(W-114,196,30,66);
  // closed eyes (manga)
  x.strokeStyle='#000'; x.lineWidth=6;
  x.beginPath(); x.moveTo(190,270); x.quadraticCurveTo(215,278,240,270); x.stroke();
  x.beginPath(); x.moveTo(290,268); x.quadraticCurveTo(315,276,340,266); x.stroke();
  // lashes
  x.lineWidth=3;
  for(let i=0;i<3;i++){ x.beginPath(); x.moveTo(195+i*15,272); x.lineTo(190+i*15,285); x.stroke(); }
  // mouth small
  x.lineWidth=4; x.beginPath(); x.moveTo(248,330); x.quadraticCurveTo(262,335,276,330); x.stroke();
  // ink hatching
  x.strokeStyle='rgba(0,0,0,0.55)'; x.lineWidth=1.2;
  for(let i=0;i<40;i++){ const hx=60+Math.random()*400, hy=Math.random()*500; x.beginPath(); x.moveTo(hx,hy); x.lineTo(hx+18,hy+8); x.stroke(); }
  x.restore();
  // harsh contrast like screenshot photocopy + darken a lil
  x.fillStyle='rgba(0,0,0,0.22)'; x.fillRect(0,0,W,H*0.70);
  // bottom bar baked black so no white fringe under overlay
  x.fillStyle='#060607'; x.fillRect(0,H*0.70,W,H*0.30);
  x.fillStyle='#f2ede8'; x.font='italic 300 62px "Cormorant Garamond", Georgia, serif'; x.textAlign='center';
  x.save(); x.translate(W/2, H*0.70+ H*0.15); x.transform(1,0,-0.12,1,0,0);
  x.fillText('cc',0,14); x.restore();
  x.fillStyle='rgba(255,255,255,0.45)'; x.font='10px monospace'; x.fillText('001 — lie',W/2,H-18);

  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  return tex;
}
function makePhotoFront(img){
  const W=512, H=760;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle='#ece7e0'; x.fillRect(0,0,W,H);
  // cover-fit photo into top 70%
  const artH=H*0.70;
  x.save(); x.beginPath(); x.rect(0,0,W,artH); x.clip();
  try{ x.filter='contrast(1.12) brightness(0.82) saturate(0.85)'; }catch(e){}
  const iw=img.width||img.videoWidth||512, ih=img.height||img.videoHeight||512;
  const s=Math.max(W/iw, artH/ih);
  const dw=iw*s, dh=ih*s;
  x.drawImage(img,(W-dw)/2,(artH-dh)/2,dw,dh);
  try{ x.filter='none'; }catch(e){}
  // darken cleanly to sit in dark bg
  x.fillStyle='rgba(0,0,0,0.22)'; x.fillRect(0,0,W,artH);
  x.restore();
  // subtle grain to match dither vibe
  for(let i=0;i<1200;i++){ x.fillStyle=`rgba(0,0,0,${Math.random()*0.05})`; x.fillRect(Math.random()*W, Math.random()*artH,1,1); }
  x.fillStyle='#060607'; x.fillRect(0,artH,W,H-artH);
  x.fillStyle='#f2ede8'; x.font='italic 300 76px "Cormorant Garamond", Georgia, serif'; x.textAlign='center';
  x.save(); x.translate(W/2, artH+(H-artH)*0.52); x.transform(1,0,-0.12,1,0,0);
  x.fillText('cc',0,16); x.restore();
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  return tex;
}
function makeBackTexture(){
  const c=document.createElement('canvas'); c.width=512; c.height=760;
  const x=c.getContext('2d'); x.fillStyle='#0a0a0a'; x.fillRect(0,0,512,760);
  x.strokeStyle='#222'; x.strokeRect(20,20,472,720);
  x.fillStyle='#888'; x.font='italic 28px Georgia'; x.textAlign='center'; x.fillText('lie.',256,380);
  x.font='11px monospace'; x.fillText('cc — 001',256,410);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const CW=0.88, CH=1.30, D=0.035;
const frontTex=makeCardTexture(), backTex=makeBackTexture();
const edgeMat=new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.5});
const frontMat=new THREE.MeshStandardMaterial({map:frontTex, roughness:0.55, metalness:0.05, color:0xffffff});
// photo is B&W idle, full color while touching (driven by touch smoothing)
frontMat.userData.uSat={value:0};
frontMat.onBeforeCompile=(sh)=>{
  sh.uniforms.uSat=frontMat.userData.uSat;
  sh.fragmentShader=('uniform float uSat;\n'+sh.fragmentShader).replace(
    '#include <map_fragment>',
    `#include <map_fragment>
    float satLum=dot(diffuseColor.rgb, vec3(0.299,0.587,0.114));
    diffuseColor.rgb=mix(vec3(satLum), diffuseColor.rgb, uSat);`
  );
};
const backMat=new THREE.MeshStandardMaterial({map:backTex, roughness:0.7});
// bottom label box: black idle -> white on touch (overlays baked label)
function makeLabelTex(bg, fg, sub){
  const W=512, H=228;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  x.fillStyle=fg; x.textAlign='center';
  x.font='italic 300 84px "Cormorant Garamond", Georgia, serif';
  x.save(); x.translate(W/2, H*0.58); x.transform(1,0,-0.12,1,0,0);
  x.fillText('cc',0,0); x.restore();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
let labelBlackTex=makeLabelTex('#060607','#f2ede8'), labelWhiteTex=makeLabelTex('#d9e2e8','#0a0a0a');

// use local image file for card if present — save your image as card.jpg next to index.html
let lastPhoto=null;
function applyPhoto(img){
  try{
    lastPhoto=img;
    const tex=makePhotoFront(img);
    frontMat.map=tex; frontMat.needsUpdate=true;
  }catch(e){ console.warn('photo apply failed', e); }
}
// redraw card once webfont arrives so canvas uses thin italic like reference
if(document.fonts?.ready){
  document.fonts.load('italic 300 76px "Cormorant Garamond"').catch(()=>{});
  document.fonts.ready.then(()=>{
    try{
      frontMat.map = lastPhoto ? makePhotoFront(lastPhoto) : makeCardTexture();
      frontMat.needsUpdate=true;
      labelBlackTex=makeLabelTex('#060607','#f2ede8'); labelBlackMat.map=labelBlackTex; labelBlackMat.needsUpdate=true;
      labelWhiteTex=makeLabelTex('#d9e2e8','#0a0a0a'); labelWhiteMat.map=labelWhiteTex; labelWhiteMat.needsUpdate=true;
    }catch(e){}
  });
}
const texLoader=new THREE.TextureLoader(); texLoader.setCrossOrigin('anonymous');
['./card.jpg','./card.png','./card.jpeg','./card.webp'].forEach(p=>{
  texLoader.load(p, t=>{ t.colorSpace=THREE.SRGBColorSpace; const im=t.image; if(im) applyPhoto(im); }, undefined, ()=>{});
});
// also allow drop / paste of the image directly onto page
// landscape images -> background (like your wings art), portrait -> card
const bgimg=document.getElementById('bgimg');
function setBackground(img){
  try{
    const url = img.currentSrc || img.src;
    if(url) bgimg.src=url;
    else { const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0); bgimg.src=c.toDataURL(); }
  }catch(e){}
}
['./bg.jpg','./bg.png','./bg.webp','./background.jpg'].forEach(p=>{
  const im=new Image(); im.onload=()=>{ bgimg.src=p; }; im.src=p;
});
function loadFileAsPhoto(file){
  if(!file||!file.type.startsWith('image/')) return;
  const url=URL.createObjectURL(file);
  const im=new Image(); im.onload=()=>{
    const isBg = /bg|background|wings/i.test(file.name) || im.width > im.height*1.2;
    if(isBg) setBackground(im); else applyPhoto(im);
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }; im.src=url;
}
addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer?.files?.[0]; if(f) loadFileAsPhoto(f); });
addEventListener('dragover', e=>e.preventDefault());
addEventListener('paste', e=>{ const f=[...(e.clipboardData?.files||[])][0]; if(f) loadFileAsPhoto(f); });

const card=new THREE.Group();
const box=new THREE.Mesh(new THREE.BoxGeometry(CW,CH,D),
  [edgeMat,edgeMat,edgeMat,edgeMat,frontMat,backMat]);
card.add(box);
// label overlay: black box idle, white box on touch — full cover, no fringe
const labelGeo=new THREE.PlaneGeometry(CW*0.998, CH*0.298);
const labelBlackMat=new THREE.MeshStandardMaterial({map:labelBlackTex, roughness:0.6});
const labelWhiteMat=new THREE.MeshStandardMaterial({map:labelWhiteTex, roughness:0.6, transparent:true, opacity:0});
const labelBlackMesh=new THREE.Mesh(labelGeo, labelBlackMat);
const labelWhiteMesh=new THREE.Mesh(labelGeo, labelWhiteMat);
labelBlackMesh.position.set(0,-CH*0.351, D/2+0.002);
labelWhiteMesh.position.set(0,-CH*0.351, D/2+0.0035);
card.add(labelBlackMesh); card.add(labelWhiteMesh);
// minimal permanent horizontal edge drift: gold / black / white
const edgeGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(CW+0.0035, CH+0.0035, D+0.0035));
const edgeWhite=new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.12}));
const edgeGold=new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({color:0xc9a86a, transparent:true, opacity:0.30}));
const edgeBlack=new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({color:0x000000, transparent:true, opacity:0.55}));
card.add(edgeWhite); card.add(edgeGold); card.add(edgeBlack);
let labelOp=0;

// subtle glow plane behind card
const glowTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
 const g=x.createRadialGradient(128,128,10,128,128,128); g.addColorStop(0,'rgba(255,255,255,0.55)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,256,256);
 const t=new THREE.CanvasTexture(c); return t; })();
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, transparent:true, opacity:0.18, depthWrite:false}));
glow.scale.set(2.25,2.25,1); card.add(glow); glow.position.z=-0.3;

scene.add(card);
card.rotation.set(0.06,-0.14,0.02);
card.position.y=-0.25;

// mouse — lean only while touching (press or hover on card)
let mx=0,my=0,tx=0,ty=0,lean=0,isDown=false,isHover=false,hasPointer=false;
let detailOpen=false, detailAmt=0, downX=0, downY=0;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const detailEl=document.getElementById('detail');
const enterEl=document.getElementById('enter');
const enterTitle=enterEl?.querySelector('h1');
let entered=false, enterAmt=0;
let actx=null, gainNode=null, audioEl=null, muted=false, lastAT=0, volLevel=0.8;
const FADE=2.0;
function targetVol(){ return muted?0.0001:Math.max(0.0001,volLevel); }
function initAudio(){
  try{
    if(actx){ actx.resume(); return; }
    actx=new (window.AudioContext||window.webkitAudioContext)();
    gainNode=actx.createGain(); gainNode.gain.value=0.0001; gainNode.connect(actx.destination);
    audioEl=new Audio(); audioEl.loop=true; audioEl.preload='auto';
    const srcs=[
      './music.mp3/sematary _ ghost mountain - worlds a f _red room valentine_ (mp3cut.net).mp3',
      './music.mp3'
    ];
    let si=0;
    audioEl.addEventListener('error',()=>{ si++; if(si<srcs.length){ audioEl.src=encodeURI(srcs[si]); audioEl.load(); } });
    audioEl.src=encodeURI(srcs[0]);
    actx.createMediaElementSource(audioEl).connect(gainNode);
    audioEl.play().then(()=>{
      const t0=actx.currentTime;
      gainNode.gain.cancelScheduledValues(t0);
      gainNode.gain.setValueAtTime(0.0001,t0);
      gainNode.gain.exponentialRampToValueAtTime(targetVol(),t0+FADE+0.5);
    }).catch(()=>{});
    // little fade out into loop end + fade back in after wrap
    audioEl.addEventListener('timeupdate',()=>{
      if(!audioEl.duration||!actx) return;
      const ct=audioEl.currentTime, dur=audioEl.duration, t=actx.currentTime;
      if(ct>lastAT&&dur-ct<FADE){
        gainNode.gain.cancelScheduledValues(t);
        gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
        gainNode.gain.linearRampToValueAtTime(0.0001,t+(dur-ct));
      }
      if(ct<lastAT-0.5){
        gainNode.gain.cancelScheduledValues(t);
        gainNode.gain.setValueAtTime(0.0001,t);
        gainNode.gain.exponentialRampToValueAtTime(targetVol(),t+FADE);
      }
      lastAT=ct;
    });
  }catch(e){}
}
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('pointerdown',e=>e.stopPropagation());
const volEl=document.getElementById('vol');
volEl.addEventListener('pointerdown',e=>e.stopPropagation());
volEl.addEventListener('input',()=>{
  volLevel=Math.max(0.0001,volEl.value/100);
  if(volEl.value>0&&muted){ muted=false; muteBtn.textContent='sound on'; }
  if(actx&&gainNode&&!muted){
    const t=actx.currentTime;
    gainNode.gain.cancelScheduledValues(t);
    gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
    gainNode.gain.exponentialRampToValueAtTime(targetVol(),t+0.25);
  }
});
muteBtn.addEventListener('click',e=>{
  e.stopPropagation();
  muted=!muted;
  muteBtn.textContent=muted?'sound off':'sound on';
  if(actx&&gainNode){
    const t=actx.currentTime;
    gainNode.gain.cancelScheduledValues(t);
    gainNode.gain.setValueAtTime(Math.max(0.0001,gainNode.gain.value),t);
    if(muted) gainNode.gain.linearRampToValueAtTime(0.0001,t+0.4);
    else gainNode.gain.exponentialRampToValueAtTime(targetVol(),t+0.8);
  }
  if(audioEl&&audioEl.paused&&!muted) audioEl.play().catch(()=>{});
});
card.scale.setScalar(0.94);
function dismissEnter(){
  if(!enterEl||enterEl.classList.contains('hidden')) return;
  entered=true;
  initAudio();
  enterEl.classList.add('hidden');
  setTimeout(()=>enterEl.remove(),1000);
}
enterEl.addEventListener('click',dismissEnter);
addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ' ) dismissEnter(); });
// little 3d tilt on enter text
addEventListener('pointermove',e=>{
  if(!enterEl||enterEl.classList.contains('hidden')||!enterTitle) return;
  const nx=(e.clientX/innerWidth-0.5), ny=(e.clientY/innerHeight-0.5);
  enterTitle.style.transform=`rotateY(${(nx*10).toFixed(2)}deg) rotateX(${(-ny*10).toFixed(2)}deg) translateZ(12px)`;
});
function hitCard(cx,cy){
  ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  return ray.intersectObject(box,false).length>0;
}
function updateHover(e){
  if(!entered){ isHover=false; return; }
  isHover=hitCard(e.clientX,e.clientY);
  canvas.style.cursor=isHover?'pointer':'default';
}
function setDetail(open){
  detailOpen=open;
  detailEl.classList.toggle('open',open);
}
addEventListener('pointermove',e=>{
  hasPointer=true;
  tx=(e.clientX/innerWidth-0.5)*2;
  ty=(e.clientY/innerHeight-0.5)*2;
  updateHover(e);
});
addEventListener('pointerdown',e=>{ isDown=true; hasPointer=true; downX=e.clientX; downY=e.clientY; updateHover(e); });
addEventListener('pointerup',e=>{
  const moved=Math.hypot(e.clientX-downX, e.clientY-downY);
  isDown=false;
  if(!entered) return;
  const onCard=hitCard(e.clientX,e.clientY);
  if(moved<7&&onCard) setDetail(!detailOpen);
});
addEventListener('keydown',e=>{ if(e.key==='Escape') setDetail(false); });
addEventListener('pointerleave',()=>{ isDown=false; isHover=false; hasPointer=false; });
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const clock=new THREE.Clock();
let prevT=0;
function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  const dt=Math.min(0.05, Math.max(0.001, t-prevT||0.016)); prevT=t;
  // soft follow — no snap
  mx+=(tx-mx)*0.035; my+=(ty-my)*0.035;
  const wantLean=(isDown||isHover)?1:0;
  lean+=(wantLean-lean)*0.035;
  if(!hasPointer) lean+=(0-lean)*0.02;
  // card shows normally after entering: ease scale/position in
  enterAmt+=((entered?1:0)-enterAmt)*0.045;
  const enterEase=enterAmt*enterAmt*(3-2*enterAmt);
  card.scale.setScalar(0.94+0.06*enterEase);
  // idle float always; lean offsets only apply with lean factor
  const narrow=innerWidth<760;
  const detailTX=narrow?0:-0.55, detailTY=narrow?0.55:-0.05;
  detailAmt+=((detailOpen?1:0)-detailAmt)*0.06;
  const baseY=-0.25+Math.sin(t*1.1)*0.08+(-my*0.3)*lean-(1-enterEase)*0.25;
  const baseX=Math.sin(t*0.6)*0.04+(mx*0.5)*lean;
  card.position.y=baseY*(1-detailAmt)+detailTY*detailAmt+Math.sin(t*1.1)*0.03*detailAmt;
  card.position.x=baseX*(1-detailAmt)+detailTX*detailAmt;
  const faceFront=detailAmt*0.7;
  card.rotation.y=(-0.10+mx*0.65*lean)*(1-faceFront)+Math.sin(t*0.7)*0.03*(1-lean*0.5);
  card.rotation.x=(0.04+my*0.50*lean)*(1-faceFront)+Math.cos(t*0.9)*0.025*(1-lean*0.5);
  card.rotation.z=0.015+Math.sin(t*0.5)*0.015*(1-lean*0.4)+(mx*0.10+my*0.05)*lean;
  // bottom box: black idle -> white on touch (smoothed)
  const eased=lean*lean*(3-2*lean);
  labelOp+=(eased-labelOp)*0.06;
  labelWhiteMat.opacity=labelOp;
  if(frontMat.userData.uSat) frontMat.userData.uSat.value=Math.max(labelOp,detailAmt);
  // slow permanent drift around card — horizontal + vertical, gold / black / white
  const driftX=Math.sin(t*0.45)*0.007+Math.sin(t*0.23+1.7)*0.004;
  const driftY=Math.sin(t*0.38+0.6)*0.006+Math.sin(t*0.19+2.1)*0.0035;
  edgeWhite.material.opacity=0.10+labelOp*0.20;
  edgeGold.material.opacity=0.28+labelOp*0.14;
  edgeBlack.material.opacity=0.50;
  edgeGold.position.set(driftX+0.005, driftY+0.004, 0);
  edgeBlack.position.set(driftX-0.005, driftY-0.004, 0);
  edgeWhite.position.set(driftX*0.4, driftY*0.4, 0);
  labelWhiteMesh.position.x=driftX*0.6; labelWhiteMesh.position.y=-CH*0.351+driftY*0.6;
  labelBlackMesh.position.x=driftX*0.4; labelBlackMesh.position.y=-CH*0.351+driftY*0.4;
  // mouse light follows cursor in world, small radius pop when touching
  const lx=mx*2.6, ly=-my*1.8;
  mouseLight.position.x+=(lx-mouseLight.position.x)*0.07;
  mouseLight.position.y+=(ly-mouseLight.position.y)*0.07;
  mouseLight.position.z=1.8;
  const wantI = !hasPointer ? 0.7 : (isDown||isHover ? 9.0 : 2.2);
  mouseLight.intensity += (wantI - mouseLight.intensity)*0.05;
  // slight camera drift for parallax vs bg
  camera.position.x=mx*0.15*lean; camera.position.y=-my*0.1*lean; camera.lookAt(0,-0.2,0);
  if(bgimg) bgimg.style.translate=`${(-mx*14).toFixed(1)}px ${(-my*10).toFixed(1)}px`;
  renderer.render(scene,camera);
}
tick();
</script>
